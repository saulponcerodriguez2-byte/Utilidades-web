<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilidades Web - Herramientas Online Gratis</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; padding: 20px; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 25px; font-size: 1.8rem; }
        .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2 { font-size: 1.2rem; color: #34495e; margin-bottom: 12px; border-bottom: 2px solid #ecf0f1; padding-bottom: 5px; }
        textarea, input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; margin-bottom: 10px; resize: vertical; }
        textarea { height: 100px; }
        .stats { display: flex; justify-content: space-between; font-weight: bold; color: #555; background: #f9f9f9; padding: 10px; border-radius: 6px; margin-top: 5px; font-size: 0.95rem; }
        button { background-color: #3498db; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-size: 1rem; width: 100%; transition: background 0.2s; margin-top: 5px; }
        button:hover { background-color: #2980b9; }
        .btn-group { display: flex; gap: 10px; }
        .result-pass { font-family: monospace; font-size: 1.1rem; background: #e8f4fd; padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 10px; color: #2980b9; word-break: break-all; }
        .strength { font-size: 0.9rem; font-weight: bold; margin-top: 5px; text-align: right; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Utilidades Web Gratis</h1>

        <!-- Herramienta 1: Contador -->
        <div class="card">
            <h2>Contador de Palabras y Caracteres</h2>
            <textarea id="textInput" placeholder="Escribe o pega tu texto aquí..."></textarea>
            <div class="stats">
                <span>Palabras: <span id="wordCount">0</span></span>
                <span>Caracteres: <span id="charCount">0</span></span>
            </div>
        </div>

        <!-- Herramienta 2: Conversor de Texto -->
        <div class="card">
            <h2>Convertidor de Mayúsculas / Minúsculas</h2>
            <div class="btn-group">
                <button onclick="toUpper()">MAYÚSCULAS</button>
                <button onclick="toLower()">minúsculas</button>
            </div>
        </div>

        <!-- Herramienta 3: Generador y Comprobador de Contraseñas -->
        <div class="card">
            <h2>Generador y Medidor de Contraseñas</h2>
            <div class="result-pass" id="passOutput">Haz clic en generar</div>
            <button onclick="generatePassword()">Generar Contraseña Segura</button>
            <div class="strength" id="passStrength"></div>
        </div>
    </div>

    <script>
        // Contador
        const textInput = document.getElementById('textInput');
        const wordCount = document.getElementById('wordCount');
        const charCount = document.getElementById('charCount');

        textInput.addEventListener('input', () => {
            const val = textInput.value;
            charCount.textContent = val.length;
            const words = val.trim() ? val.trim().split(/\s+/).length : 0;
            wordCount.textContent = words;
        });

        // Conversor
        function toUpper() {
            textInput.value = textInput.value.toUpperCase();
            textInput.dispatchEvent(new Event('input'));
        }
        function toLower() {
            textInput.value = textInput.value.toLowerCase();
            textInput.dispatchEvent(new Event('input'));
        }

        // Generador de Contraseñas
        function generatePassword() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";
            let pass = "";
            for (let i = 0; i < 16; i++) {
                pass += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('passOutput').textContent = pass;
            
            const strengthElem = document.getElementById('passStrength');
            strengthElem.textContent = "Seguridad: Alta (16 caracteres)";
            strengthElem.style.color = "#27ae60";
        }
    </script>
</body>
</html>
