<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilidades Web Rápidas - Contador y Generador</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            margin-bottom: 20px;
        }
        h1 { font-size: 22px; color: #007BFF; text-align: center; }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            box-sizing: border-box;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
            font-weight: bold;
            color: #555;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-size: 16px;
        }
        button:hover { background-color: #0056b3; }
        .result-box {
            margin-top: 15px;
            padding: 10px;
            background: #e9ecef;
            border-radius: 4px;
            word-break: break-all;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <!-- Utilidad 1: Contador de Palabras y Caracteres -->
    <div class="container">
        <h1>Contador de Palabras y Caracteres</h1>
        <p>Escribe o pega tu texto para analizarlo al instante:</p>
        <textarea id="textInput" placeholder="Escribe aquí..." oninput="contarTexto()"></textarea>
        <div class="stats">
            <span>Palabras: <span id="wordCount">0</span></span>
            <span>Caracteres: <span id="charCount">0</span></span>
        </div>
    </div>

    <!-- Utilidad 2: Generador de Contraseñas Seguras -->
    <div class="container">
        <h1>Generador de Contraseñas</h1>
        <p>Crea una contraseña segura de forma automática:</p>
        <button onclick="generarPassword()">Generar Contraseña</button>
        <div class="result-box" id="passwordOutput">Tu contraseña aparecerá aquí</div>
    </div>

    <script>
        // Lógica del contador
        function contarTexto() {
            const text = document.getElementById('textInput').value;
            const charCount = text.length;
            // Cuenta palabras separadas por espacios
            const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
            
            document.getElementById('charCount').innerText = charCount;
            document.getElementById('wordCount').innerText = words;
        }

        // Lógica del generador de contraseñas
        function generarPassword() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+";
            let password = "";
            for (let i = 0; i < 16; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('passwordOutput').innerText = password;
        }
    </script>

</body>
</html>
